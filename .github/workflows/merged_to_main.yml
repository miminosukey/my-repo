name: Merged to Main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  on-merge:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run action on merge
        run: |
          echo "PR was merged into main!"
